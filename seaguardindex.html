<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaGuard Ocean Cleanup Tracker</title>

    <link rel="stylesheet" href="seaguardstyle.css">
</head>

<body>

    <header>
        <h1>SeaGuard Ocean Cleanup Tracker</h1>
        <p>Track and explore marine cleanup information.</p>
    </header>

    <main>

        <section>
            <h2>Add Cleanup Record</h2>

            <form id="cleanup-form">

                <label for="site">Site:</label>
                <input type="text" id="site" required>

                <label for="date">Date:</label>
                <input type="date" id="date" required>

                <label for="category">Debris Category:</label>
                <input type="text" id="category" required>

                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    min="0"
                    required
                >

                <button type="submit">Add Record</button>

            </form>
        </section>

        <section>
            <h2>Cleanup Records</h2>

            <div id="cleanup-list">
                <!-- Cleanup records will appear here -->
            </div>
        </section>

        <section>
            <h2>Cleanup Map</h2>

            <div id="cleanup-map">
                <!-- Map will go here later -->
            </div>
        </section>

        <section>
            <h2>Cleanup Summary</h2>

            <div id="cleanup-summary">
                <!-- Totals will appear here later -->
            </div>
        </section>

    </main>

    <footer>
        <p>SeaGuard Ocean Cleanup Tracker</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
